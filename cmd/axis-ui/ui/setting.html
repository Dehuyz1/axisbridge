<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>axisbridge — Setting</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900" x-data="settings()" x-init="init()">

<header class="bg-slate-800 text-slate-100 px-4 py-2 flex items-center gap-4">
  <div class="font-semibold">axisbridge</div>
  <nav class="flex gap-3 text-sm">
    <a href="/management" class="px-2 py-1 rounded hover:bg-slate-700">Management</a>
    <a href="/gifts"      class="px-2 py-1 rounded hover:bg-slate-700">Gift List</a>
    <a href="/setting"    class="px-2 py-1 rounded bg-slate-700">Setting</a>
  </nav>
  <div class="ml-auto text-xs" x-text="saveStatus"></div>
</header>

<main class="max-w-4xl mx-auto p-4 grid gap-6">
  <template x-for="group in groups" :key="group.title">
    <section class="bg-white shadow-sm rounded border">
      <h2 class="text-sm font-semibold px-3 py-2 border-b bg-slate-50" x-text="group.title"></h2>
      <div class="p-3 grid gap-3">
        <template x-for="f in group.fields" :key="f.key">
          <div class="grid grid-cols-3 gap-3 items-center">
            <label class="text-sm font-medium" :for="f.key">
              <span x-text="f.label"></span>
              <div class="text-xs text-slate-500 font-normal" x-text="f.hint"></div>
              <code class="text-[10px] text-slate-400" x-text="f.key"></code>
            </label>
            <template x-if="f.type === 'bool'">
              <input :id="f.key" type="checkbox" x-model="values[f.key]" @change="save(f)" class="h-5 w-5" />
            </template>
            <template x-if="f.type !== 'bool'">
              <input :id="f.key" :type="f.type === 'int' ? 'number' : 'text'"
                     x-model="values[f.key]" @change="save(f)"
                     class="border rounded px-2 py-1 text-sm col-span-1 w-40" />
            </template>
            <div class="text-xs text-slate-500" x-text="statusOf(f.key)"></div>
          </div>
        </template>
      </div>
    </section>
  </template>

  <section class="bg-white shadow-sm rounded border">
    <h2 class="text-sm font-semibold px-3 py-2 border-b bg-slate-50">Raw settings JSON</h2>
    <pre class="p-3 text-xs overflow-auto" x-text="rawJson"></pre>
  </section>
</main>

<script>
function settings() {
  return {
    values: {}, dirty: {}, saveStatus: "",
    rawJson: "{}",
    groups: [
      { title: "OTP (register)", fields: [
        { key: "otp.max_attempt", label: "Max Attempt", type: "int",    hint: "Total percobaan OTP per nomor sebelum dilempar ke gift" },
        { key: "otp.retry_gap",   label: "Retry Gap",   type: "string", hint: "Jeda antar percobaan OTP (mis. 90s, 1m)" },
        { key: "otp.debounce",    label: "Debounce",    type: "string", hint: "Cooldown push nomor duplikat (mis. 10m)" },
      ]},
      { title: "Gift", fields: [
        { key: "gift.quota_daily", label: "Quota Daily", type: "int", hint: "Batas gift sukses per hari (global)" },
      ]},
      { title: "Worker", fields: [
        { key: "worker.register_enabled", label: "Register worker enabled", type: "bool", hint: "Matikan untuk pause semua OTP request" },
        { key: "worker.gift_enabled",     label: "Gift worker enabled",     type: "bool", hint: "Matikan untuk pause semua gift" },
        { key: "log.level",               label: "Log level",               type: "string", hint: "debug|info|warn|error (butuh restart binary)" },
      ]},
    ],

    async init() {
      await this.reload();
      setInterval(() => this.reload(), 10000);
    },
    async reload() {
      const r = await fetch("/api/settings").then(r => r.json());
      this.rawJson = JSON.stringify(r, null, 2);
      for (const g of this.groups) for (const f of g.fields) {
        const raw = r[f.key];
        if (raw === undefined) continue;
        this.values[f.key] = raw;
      }
    },
    statusOf(k) { return this.dirty[k] || ""; },
    async save(field) {
      const val = this.coerce(field, this.values[field.key]);
      this.dirty[field.key] = "saving…";
      const res = await fetch("/api/settings/" + encodeURIComponent(field.key), {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(val),
      });
      if (res.ok) {
        this.dirty[field.key] = "saved " + new Date().toLocaleTimeString();
        this.saveStatus = "Saved " + field.key;
        setTimeout(() => this.dirty[field.key] = "", 3000);
      } else {
        this.dirty[field.key] = "error " + res.status;
      }
      this.reload();
    },
    coerce(field, v) {
      if (field.type === "int")  return Number(v);
      if (field.type === "bool") return Boolean(v);
      return String(v);
    },
  }
}
</script>
</body>
</html>
