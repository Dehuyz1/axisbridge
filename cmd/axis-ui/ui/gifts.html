<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>axisbridge — Gift List</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  html, body { height: 100%; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  .cell { padding: 6px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  .table-scroll { max-height: calc(100vh - 160px); overflow: auto; }
  pre { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body class="bg-slate-100 text-slate-900" x-data="gifts()" x-init="init()">

<header class="bg-slate-800 text-slate-100 px-4 py-2 flex items-center gap-4">
  <div class="font-semibold">axisbridge</div>
  <nav class="flex gap-3 text-sm">
    <a href="/management" class="px-2 py-1 rounded hover:bg-slate-700">Management</a>
    <a href="/gifts"      class="px-2 py-1 rounded bg-slate-700">Gift List</a>
    <a href="/setting"    class="px-2 py-1 rounded hover:bg-slate-700">Setting</a>
  </nav>
  <div class="ml-auto text-xs opacity-70">
    Total: <span x-text="rows.length"></span> · Last refresh: <span x-text="lastRefresh"></span>
  </div>
</header>

<section class="p-3 flex gap-2 items-center bg-white border-b">
  <input type="search" placeholder="Filter msisdn…" class="border rounded px-2 py-1 text-sm" x-model="filter" />
  <button class="px-2 py-1 border rounded text-sm hover:bg-slate-100" @click="reload()">Refresh</button>
  <div class="ml-auto text-xs text-slate-500">Cuma tampilkan gift sukses. Setiap baris = 1 transaksi.</div>
</section>

<section class="table-scroll bg-white">
  <table class="min-w-full text-sm">
    <thead class="bg-slate-200 sticky top-0">
      <tr>
        <th class="cell text-left w-56">Nomor</th>
        <th class="cell text-left">Bukti Transaksi Sukses</th>
        <th class="cell text-left w-48">Waktu</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="r in filtered()" :key="r.id">
        <tr>
          <td class="cell font-mono" x-text="r.msisdn"></td>
          <td class="cell"><pre class="text-xs" x-text="fmtProof(r.proof)"></pre></td>
          <td class="cell text-xs text-slate-600" x-text="fmtTime(r.created_at)"></td>
        </tr>
      </template>
      <tr x-show="!rows.length"><td colspan="3" class="cell text-center text-slate-500 py-6">Belum ada gift sukses.</td></tr>
    </tbody>
  </table>
</section>

<script>
function gifts() {
  return {
    rows: [], filter: "", lastRefresh: "-",
    init() {
      this.reload();
      setInterval(() => this.reload(), 10000);
    },
    async reload() {
      this.rows = await fetch("/api/gifts?limit=1000").then(r => r.json()) || [];
      this.lastRefresh = new Date().toLocaleTimeString();
    },
    filtered() {
      if (!this.filter) return this.rows;
      const q = this.filter.trim();
      return this.rows.filter(r => r.msisdn.includes(q));
    },
    fmtProof(p) {
      try { return JSON.stringify(p, null, 2); }
      catch { return String(p); }
    },
    fmtTime(s) { return s ? new Date(s).toLocaleString("id-ID") : "-"; },
  }
}
</script>
</body>
</html>
